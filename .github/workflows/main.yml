name: GoldMoodAstro Deploy

# =============================================================================
# 2026-07-20 — rsync tabanlı dağıtım GIT PULL + SUNUCUDA BUILD akışına çevrildi.
#
# NEDEN:
#   Eski akış `rsync --delete` ile doğrudan çalışan dizinlere yazıyordu.
#     • Aktarım sırasında frontend/.next siliniyor, uygulama build'siz kalıyor,
#       PM2 sürekli yeniden başlıyordu (52 restart, nginx connection refused).
#     • /var/www/goldmoodastro bir GIT DEPOSU olduğu için rsync çalışma ağacını
#       kirletiyordu; elle yapılan `git pull` sürekli "local changes / untracked
#       files would be overwritten" ile kilitleniyordu. İki rakip dağıtım
#       mekanizması (CI rsync + elle git pull) birbiriyle çakışıyordu.
#
# YENİ AKIŞ:
#   1) build-check (CI)  — kod derleniyor mu? Kırıksa prod'a hiç dokunulmaz.
#   2) deploy (TEK iş)   — sunucuda: git pull → build → pm2 reload → sağlık
#                          kontrolü; herhangi bir adım düşerse önceki commit'e
#                          geri dönülür ve yeniden derlenir.
#
# NEDEN TEK İŞ: üç ayrı iş paralel çalışıp aynı git deposunda `git pull`
# yapsaydı birbirini kilitlerdi. Sıra: backend → admin → frontend.
#
# .env DOSYALARI: git tarafından yönetilmiyor (gitignore), dolayısıyla artık
# dağıtım sırasında korunması gereken bir şey değil — rsync'teki en kırılgan
# noktalardan biri kendiliğinden ortadan kalktı.
#
# SEED: bilinçli olarak otomatik ÇALIŞTIRILMIYOR. Şema/içerik değişiklikleri
# elle uygulanır (`bun src/db/index.ts --no-drop --only=...`), çünkü tam seed
# admin şifrelerini sıfırlıyor ve kullanıcı içeriğini ezebiliyor.
# =============================================================================

# TEK BRANCH (2026-07-20): proje tek kisi tarafindan gelistiriliyor; feat
# branch'i main'e birlestirildi ve prod da main'i takip ediyor. Tek kaynak
# dogruluk: main.
on:
  push:
    branches: [main]

jobs:
  # ─── 1) Derleme kapısı — prod'a dokunmaz ──────────────────────────
  build-check:
    name: Build check (gate)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Backend build
        working-directory: backend
        run: |
          bun install --frozen-lockfile || bun install
          bun run build

      - name: Admin panel build
        working-directory: admin_panel
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          bun install --frozen-lockfile || bun install
          bun run build

      - name: Theme snapshot drift
        run: bun run check:theme

      - name: Frontend build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          NEXT_PUBLIC_APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
          NEXT_PUBLIC_APPLE_REDIRECT_URI: https://goldmoodastro.com/auth/apple/callback
        run: |
          bun install --frozen-lockfile || bun install
          bun run theme:guard
          bun run theme:drift-check
          bun run relax:drift-check
          bun run relax:asset-guard
          bun run build

  # ─── 2) Dağıtım — sunucuda git pull + build ───────────────────────
  deploy:
    name: Deploy (git pull + build on server)
    needs: build-check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout (deploy scripti icin)
        uses: actions/checkout@v4

      - name: Deploy over SSH (baglanti timeout'unda retry + IPv4)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_KEY: ${{ secrets.VPS_KEY }}
        run: |
          # GitHub 'run' adimini 'bash -e' ile calistirir; ssh 255'te script retry'a
          # gecmeden abort etmesin diye errexit'i KAPAT (exit kodlarini elle yonetiyoruz).
          set +e -u -o pipefail
          KEYFILE="$(mktemp)"
          printf '%s\n' "$VPS_KEY" > "$KEYFILE"
          chmod 600 "$KEYFILE"
          # -4: IPv4'e zorla (sunucunun IPv6 adresi de var, bazen flaky rota -> :22 timeout).
          # ConnectTimeout dusuk tutulur: baglanti kurulamazsa hizli fail edip retry'a gecsin.
          # ServerAlive*: uzun/sessiz build sirasinda oturum idle dusmesin.
          SSH_OPTS="-4 -i $KEYFILE -o ConnectTimeout=40 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR"
          # GitHub runner -> VPS :22 zaman zaman dakikalarca timeout veriyor (runner agi
          # / IP araligi flaky). 4 deneme/45s (~3dk) yetmiyordu; 8 denemeye + artan
          # backoff'a cikardik (~10dk pencere) ki uzun blip'ler de yakalansin. Yine de
          # basarisiz olursa lokalden manuel: ssh goldmoodastro 'bash -s' < scripts/vps-deploy.sh
          MAX=8
          BACKOFFS="45 60 60 90 90 120 120"
          code=1
          for attempt in $(seq 1 $MAX); do
            echo "== Deploy denemesi $attempt/$MAX =="
            ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" 'bash -s' < scripts/vps-deploy.sh
            code=$?
            # ssh exit 255 = baglanti/auth hatasi (dial timeout dahil) -> retry.
            # Diger kodlar (0 basari, 1 rollback) remote script'ten gelir -> final, retry etme.
            if [ "$code" -eq 255 ] && [ "$attempt" -lt "$MAX" ]; then
              wait_s=$(echo "$BACKOFFS" | cut -d' ' -f"$attempt"); wait_s="${wait_s:-120}"
              echo "::warning::SSH baglanti hatasi (deneme $attempt/$MAX) — ${wait_s}s sonra tekrar"
              sleep "$wait_s"
              continue
            fi
            break
          done
          rm -f "$KEYFILE"
          exit "$code"
